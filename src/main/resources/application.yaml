server:
  port: ${PORT:9966}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:vishnudb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
